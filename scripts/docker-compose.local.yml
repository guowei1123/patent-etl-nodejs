services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: patent_etl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:?missing password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patent_etl"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_USER:?missing user}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD:?missing password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  init-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["setup"]
    depends_on:
      - minio
    environment:
      MINIO_USER: ${LOCAL_MINIO_USER:?missing user}
      MINIO_PASSWORD: ${LOCAL_MINIO_PASSWORD:?missing password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'i=0; until mc alias set local http://minio:9000 "$$MINIO_USER" "$$MINIO_PASSWORD"; do i=$$((i+1)); if [ "$$i" -ge 30 ]; then exit 1; fi; sleep 2; done; mc mb --ignore-existing local/patent-images'
volumes:
  postgres_data:
  redis_data:
  minio_data:
